[build-system]
requires = ["setuptools==79.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ea-farm"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
  "mypy==1.18.2",
  "psutil==7.2.2",
  "pytest==8.4.2",
  "pytest-asyncio==1.3.0",
  "ruff==0.14.9",
]

[tool.setuptools]
packages = [
  "brain",
  "brain.common",
  "brain.gateway",
  "brain.news",
  "brain.regime",
  "brain.risk",
  "brain.signal",
  "brain.store",
  "farm_contracts",
]

[tool.setuptools.package-dir]
farm_contracts = "contracts/gen/python"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"contracts/gen/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["brain", "tests", "tools", "contracts/gen/python"]

[[tool.mypy.overrides]]
module = "research.*"
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: tests that take more than 60 seconds, including soak runs",
  "live_terminal: tests that require a real MT5 terminal and live chart",
  "mql5: tests that require MetaEditor or the MQL5 runtime",
]
